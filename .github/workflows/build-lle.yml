name: Build DLSS Swapper LLE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 portable release
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'

      - name: Build and package portable artifact
        shell: cmd
        working-directory: package
        run: |
          build_Portable.cmd
          package_Portable.cmd

      - name: Upload Windows portable archive
        uses: actions/upload-artifact@v4
        with:
          name: DLSS-Swapper-LLE-1.0.0-windows-x64
          if-no-files-found: error
          path: package/Output/DLSS.Swapper-LLE-1.0.0-windows-x64-portable.zip

  linux:
    name: Linux x64 portable release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'

      - name: Validate Linux projects
        run: |
          dotnet build linux/DlssSwapper.Linux.Cli/DlssSwapper.Linux.Cli.csproj -c Release
          dotnet build linux/DlssSwapper.Linux.Gui/DlssSwapper.Linux.Gui.csproj -c Release
          dotnet run --project linux/DlssSwapper.Linux.Tests/DlssSwapper.Linux.Tests.csproj -c Release

      - name: Publish Linux CLI and GUI
        shell: pwsh
        run: |
          dotnet restore linux/DlssSwapper.Linux.Gui/DlssSwapper.Linux.Gui.csproj -r linux-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./linux/Package-Portable.ps1 -Dotnet dotnet -OutputPath DLSS.Swapper-LLE-1.0.0-linux-x64.tar.gz

      - name: Upload Linux portable archive
        uses: actions/upload-artifact@v4
        with:
          name: DLSS-Swapper-LLE-1.0.0-linux-x64
          if-no-files-found: error
          path: DLSS.Swapper-LLE-1.0.0-linux-x64.tar.gz
