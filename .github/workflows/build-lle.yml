name: Build DLSS Swapper LLE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 checkpoint artifacts
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'

      - name: Install NSIS
        run: winget install -e --id NSIS.NSIS --version 3.12 --accept-package-agreements --accept-source-agreements

      - name: Add NSIS to PATH
        shell: pwsh
        run: '"C:\Program Files (x86)\NSIS\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'

      - name: Build and package portable artifact
        shell: cmd
        working-directory: package
        run: |
          build_Portable.cmd
          package_Portable.cmd

      - name: Build and package installer artifact
        shell: cmd
        working-directory: package
        run: |
          build_Installer.cmd
          package_Installer.cmd

      - name: Upload unsigned checkpoint artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DLSS-Swapper-LLE-1.2.5.1-windows-x64
          if-no-files-found: error
          path: |
            package/Output/DLSS.Swapper-LLE-1.2.5.1-portable.zip
            package/Output/DLSS.Swapper-LLE-1.2.5.1-installer.exe

  linux:
    name: Linux x64 checkpoint artifact
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.100'

      - name: Validate Linux projects
        run: |
          dotnet build linux/DlssSwapper.Linux.Cli/DlssSwapper.Linux.Cli.csproj -c Release
          dotnet build linux/DlssSwapper.Linux.Gui/DlssSwapper.Linux.Gui.csproj -c Release
          dotnet run --project linux/DlssSwapper.Linux.Tests/DlssSwapper.Linux.Tests.csproj -c Release

      - name: Publish Linux CLI and GUI
        shell: pwsh
        run: |
          dotnet restore linux/DlssSwapper.Linux.Gui/DlssSwapper.Linux.Gui.csproj -r linux-x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./linux/Package-Portable.ps1 -Dotnet dotnet -OutputPath DLSS-Swapper-LLE-1.2.5.1-linux-x64.tar.gz

      - name: Upload Linux checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: DLSS-Swapper-LLE-1.2.5.1-linux-x64
          if-no-files-found: error
          path: DLSS-Swapper-LLE-1.2.5.1-linux-x64.tar.gz
